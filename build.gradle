plugins {
    id "com.vanniktech.maven.publish" version "0.36.0" apply false
    id "com.diffplug.spotless" version "8.10.2" apply false
}

apply from: 'gradle/models-dev-snapshot.gradle'

// Root build.gradle — parent project only
// Subprojects: api, app
subprojects {
    group = 'run.halo.aifoundation'

    repositories {
        maven {
            name = 'Central Portal Snapshots'
            url = 'https://central.sonatype.com/repository/maven-snapshots/'
            content {
                includeGroupAndSubgroups('run.halo')
            }
        }
        mavenCentral()
    }

    plugins.withId('java') {
        apply plugin: 'com.diffplug.spotless'
        spotless {
            java {
                palantirJavaFormat('2.90.0').formatJavadoc(true)
            }
        }
    }
}