name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    uses: halo-sigs/reusable-workflows/.github/workflows/plugin-ci.yaml@v5
    with:
      ui-path: "ui"
      pnpm-version: 12.6.0
      node-version: 24
      java-version: 21
      artifacts-path: app/build/libs
