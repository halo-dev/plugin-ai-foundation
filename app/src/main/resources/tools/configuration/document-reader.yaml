schema:
  - $formkit: number
    name: maxResponseSizeMb
    label: 下载大小上限（MiB）
    value: 20
    number: integer
    min: 1
    max: 100
    step: 1
    validation: required|number|between:1,100
    help: HTTP 解压后的下载大小上限，默认 20 MiB。
  - $formkit: number
    name: maxContentCharacters
    label: 正文长度上限（字符）
    value: 200000
    number: integer
    min: 1
    max: 2000000
    step: 1
    validation: required|number|between:1,2000000
    help: 超出正文会截断，默认 200000 字符。
  - $formkit: number
    name: maxPages
    label: PDF 页数上限
    value: 200
    number: integer
    min: 1
    max: 2000
    step: 1
    validation: required|number|between:1,2000
    help: 最多读取的 PDF 页数，超出部分不读取并标记截断。
  - $formkit: switch
    name: vpnCompatibilityEnabled
    label: VPN 兼容模式
    value: false
    onValue: true
    offValue: false
    help: 使用可信 VPN/TUN 的 Fake-IP 时开启，仅兼容域名 HTTPS 443。
